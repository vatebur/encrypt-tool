<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Encryption Tool</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;650&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070b;
  --panel:#0e1118;
  --panel-2:#0a0d13;
  --text:#eef5ff;
  --muted:#91a0ba;
  --border:#1d2433;
  --accent:#19f5ff;
  --accent-2:#ff3df2;
  --danger:#ff6b6b;
  --shadow:0 26px 60px rgba(2,6,14,.6);
  --radius:16px;
  --glow:0 0 0 1px rgba(25,245,255,.15), 0 0 30px rgba(25,245,255,.15);
}
:root.light{
  --bg:#f5f7ff;
  --panel:#ffffff;
  --panel-2:#eef2ff;
  --text:#111326;
  --muted:#4c5a77;
  --border:#cfd6f3;
  --accent:#1877ff;
  --accent-2:#ff2fd4;
  --danger:#c23b3b;
  --shadow:0 18px 36px rgba(31,41,71,.12);
  --glow:0 0 0 1px rgba(24,119,255,.08), 0 14px 32px rgba(24,119,255,.12);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(900px 520px at 12% 0%, rgba(25,245,255,.18), transparent 60%),
    radial-gradient(900px 520px at 88% 10%, rgba(255,61,242,.18), transparent 55%),
    linear-gradient(135deg, rgba(255,255,255,.04), transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.02), rgba(255,255,255,.02) 1px, transparent 1px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.015), rgba(255,255,255,.015) 1px, transparent 1px, transparent 24px);
  pointer-events:none;
  z-index:-1;
}
:root.light body::before{
  background:
    radial-gradient(900px 520px at 12% 0%, rgba(24,119,255,.18), transparent 60%),
    radial-gradient(900px 520px at 88% 15%, rgba(255,47,212,.15), transparent 60%),
    linear-gradient(135deg, rgba(0,0,0,.04), transparent 45%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.03), rgba(0,0,0,.03) 1px, transparent 1px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.02), rgba(0,0,0,.02) 1px, transparent 1px, transparent 24px);
}
.container{
  max-width:900px;
  margin:36px auto 64px;
  padding:0 18px;
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:calc(var(--radius) + 6px);
  background:linear-gradient(135deg, rgba(25,245,255,.08), transparent 60%), var(--panel);
  box-shadow:var(--shadow);
}
.title{
  font-family:"Fraunces", "IBM Plex Sans", serif;
  font-size:26px;
  letter-spacing:.5px;
  margin:0;
}
.subtle{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.2px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  border:1px solid var(--border);
  color:var(--muted);
  background:var(--panel-2);
  text-transform:uppercase;
  letter-spacing:.4px;
}
.badge.ok{color:#052b35;background:color-mix(in srgb, var(--accent) 15%, var(--panel-2));border-color:color-mix(in srgb, var(--accent) 45%, var(--border));}
:root:not(.light) .badge.ok{color:#b7f9ff;}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:var(--glow);
  pointer-events:none;
  opacity:.6;
}
.section-title{
  font-family:"Fraunces", "IBM Plex Sans", serif;
  font-size:18px;
  margin:0 0 12px;
}
.label{
  font-size:11px;
  letter-spacing:.4px;
  text-transform:uppercase;
  color:var(--muted);
  margin:10px 0 6px;
}
.label.strong{color:var(--text);}
.input, .textarea{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  padding:12px 12px;
  border-radius:12px;
  font-size:13px;
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.input:focus, .textarea:focus{
  border-color:color-mix(in srgb, var(--accent) 60%, var(--border));
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.textarea{height:140px;resize:none;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:720px){.row{grid-template-columns:1fr;}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btn{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:.2px;
  transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
}
.btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#05060a;box-shadow:0 10px 24px rgba(25,245,255,.25);}
:root.light .btn.primary{color:#fff;}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn.ghost-accent{
  background:linear-gradient(135deg, rgba(25,245,255,.12), rgba(255,61,242,.12));
  border:1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  color:var(--text);
  box-shadow:0 8px 18px rgba(25,245,255,.15);
}
.btn:hover{transform:translateY(-1px);filter:saturate(1.1);}
.btn.copy-btn:hover{
  box-shadow:0 0 0 1px rgba(25,245,255,.35), 0 0 18px rgba(25,245,255,.35);
  border-color:color-mix(in srgb, var(--accent) 60%, var(--border));
}
.btn:disabled:hover{box-shadow:none;filter:none;transform:none;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.notice{
  margin-top:10px;
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  border:1px solid color-mix(in srgb, var(--danger) 60%, var(--border));
  background:color-mix(in srgb, var(--danger) 18%, var(--panel));
  color:color-mix(in srgb, var(--danger) 85%, var(--text));
  display:none;
}
.notice.show{display:block;}
.switch{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--panel-2);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:999px;
}
.toggle{
  width:44px;height:22px;border-radius:999px;border:1px solid var(--border);
  background:linear-gradient(135deg, rgba(124,245,216,.25), rgba(244,185,66,.2));
  position:relative;cursor:pointer;
}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#0b0f14;transition:transform .2s ease, background .2s ease;
}
:root.light .toggle::after{transform:translateX(22px);background:#fff;}
.hidden{display:none;}
.separator{
  height:1px;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 40%, var(--border)), transparent);
  margin:16px 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1 class="title">Local Encryption Tool</h1>
    </div>
    <div class="switch">
      <span class="subtle" id="themeLabel">Light</span>
      <button id="themeToggle" class="toggle" aria-label="Toggle theme"></button>
      <span id="status" class="badge">Loading crypto engine…</span>
    </div>
  </div>

  <section id="decryptPanel" class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <h2 class="section-title">Keypair</h2>
    </div>

    <div class="row">
      <div>
        <div class="label strong">Public Key</div>
        <input id="pub" class="input mono" readonly placeholder="Generate a keypair">
      </div>
      <div>
        <div class="label strong">Private Key</div>
        <input id="priv" class="input mono" readonly placeholder="Keep this private">
      </div>
    </div>

    <div class="actions">
      <button id="genBtn" class="btn primary" disabled>Generate Keypair</button>
      <button id="copyLink" class="btn secondary copy-btn" disabled>Copy Share Link</button>
    </div>

    <div class="separator"></div>

    <h2 class="section-title">Decrypt</h2>
    <div class="label">Ciphertext</div>
    <textarea id="decrypt_msg" class="textarea mono" placeholder="Paste ciphertext"></textarea>

    <div class="actions">
      <button id="decryptBtn" class="btn primary" disabled>Decrypt</button>
      <button id="copyPlain" class="btn secondary copy-btn" disabled>Copy Plaintext</button>
    </div>

    <div class="label">Plaintext</div>
    <textarea id="decrypt_out" class="textarea" readonly placeholder="Plaintext output"></textarea>
    <div id="decryptNotice" class="notice"></div>
  </section>

  <section id="encryptPanel" class="card hidden" style="margin-top:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <h2 class="section-title">Encrypt</h2>
      <button id="backToDecrypt" class="btn ghost-accent">⟵ Back to Decrypt</button>
    </div>

    <div class="label strong">Recipient Public Key</div>
    <input id="encrypt_pub" class="input mono" placeholder="Base64 public key" readonly>

    <div class="label">Message</div>
    <textarea id="encrypt_msg" class="textarea" placeholder="Type a message to encrypt"></textarea>

    <div class="actions">
      <button id="encryptBtn" class="btn primary" disabled>Encrypt</button>
      <button id="copyCipher" class="btn secondary copy-btn" disabled>Copy Ciphertext</button>
    </div>

    <div class="label">Ciphertext</div>
    <textarea id="encrypt_out" class="textarea mono" readonly placeholder="Ciphertext output"></textarea>
    <div id="encryptNotice" class="notice"></div>
  </section>

  <div id="keyNotice" class="notice" style="margin-top:12px;"></div>
</div>

<script type="module">
let sodiumReady = false
let sodiumLib = null

  const ui = {
  status: document.getElementById("status"),
  keyNotice: document.getElementById("keyNotice"),
  encryptNotice: document.getElementById("encryptNotice"),
  decryptNotice: document.getElementById("decryptNotice"),
  pub: document.getElementById("pub"),
  priv: document.getElementById("priv"),
  encryptPub: document.getElementById("encrypt_pub"),
  encryptMsg: document.getElementById("encrypt_msg"),
  encryptOut: document.getElementById("encrypt_out"),
  decryptMsg: document.getElementById("decrypt_msg"),
  decryptOut: document.getElementById("decrypt_out"),
  genBtn: document.getElementById("genBtn"),
  copyLink: document.getElementById("copyLink"),
  encryptBtn: document.getElementById("encryptBtn"),
  decryptBtn: document.getElementById("decryptBtn"),
  copyCipher: document.getElementById("copyCipher"),
  copyPlain: document.getElementById("copyPlain"),
  backToDecrypt: document.getElementById("backToDecrypt"),
  decryptPanel: document.getElementById("decryptPanel"),
  encryptPanel: document.getElementById("encryptPanel"),
  themeToggle: document.getElementById("themeToggle"),
  themeLabel: document.getElementById("themeLabel")
}

function setStatus(text, ok){
  ui.status.textContent = text
  ui.status.classList.toggle("ok", !!ok)
}

function setNotice(el, text){
  if(!text){
    el.textContent = ""
    el.classList.remove("show")
    return
  }
  el.textContent = text
  el.classList.add("show")
}

function enableButtons(){
  ui.genBtn.disabled = !sodiumReady
  ui.encryptBtn.disabled = !sodiumReady
  ui.decryptBtn.disabled = !sodiumReady
}

async function initSodium(){
  try{
    if(!sodiumLib){
      const mod = await import("https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.8.2/+esm")
      sodiumLib = mod.default || mod
    }
    await sodiumLib.ready
    sodiumReady = true
    setStatus("Crypto engine ready", true)
    enableButtons()
  }catch(err){
    setStatus("Crypto engine error", false)
    setNotice(ui.keyNotice, String(err))
  }
}

function safeBase64ToBytes(value){
  return sodiumLib.from_base64(value.trim())
}

function safeBytesToBase64(bytes){
  return sodiumLib.to_base64(bytes)
}

function updateKeyActions(){
  const hasPub = ui.pub.value.trim().length > 0
  const hasPriv = ui.priv.value.trim().length > 0
  ui.copyLink.disabled = !hasPub
}

async function genkey(){
  if(!sodiumReady) return
  try{
    const kp = sodiumLib.crypto_box_keypair()
    ui.pub.value = safeBytesToBase64(kp.publicKey)
    ui.priv.value = safeBytesToBase64(kp.privateKey)
    ui.decryptMsg.value = ""
    ui.decryptOut.value = ""
    ui.encryptMsg.value = ""
    ui.encryptOut.value = ""
    ui.copyCipher.disabled = true
    ui.copyPlain.disabled = true
    updateKeyActions()
  }catch(err){
    setNotice(ui.keyNotice, "Keypair generation failed: " + err)
  }
}

async function encrypt(){
  if(!sodiumReady) return
  try{
    setNotice(ui.encryptNotice, "")
    const pub = ui.encryptPub.value.trim()
    const msg = ui.encryptMsg.value
    if(!pub || !msg){
      setNotice(ui.encryptNotice, "Recipient public key and message are required.")
      return
    }
    const publicKey = safeBase64ToBytes(pub)
    const cipher = sodiumLib.crypto_box_seal(
      sodiumLib.from_string(msg),
      publicKey
    )
    ui.encryptOut.value = safeBytesToBase64(cipher)
    ui.copyCipher.disabled = false
  }catch(err){
    setNotice(ui.encryptNotice, "Encrypt failed: " + err)
  }
}

async function decrypt(){
  if(!sodiumReady) return
  try{
    setNotice(ui.decryptNotice, "")
    const cipher = ui.decryptMsg.value.trim()
    if(!cipher){
      setNotice(ui.decryptNotice, "Ciphertext is required.")
      return
    }
    const pubVal = ui.pub.value.trim()
    const privVal = ui.priv.value.trim()
    if(!pubVal || !privVal){
      setNotice(ui.decryptNotice, "Generate a keypair first.")
      return
    }
    const pubKey = safeBase64ToBytes(pubVal)
    const privKey = safeBase64ToBytes(privVal)
    const cipherBytes = safeBase64ToBytes(cipher)
    const msg = sodiumLib.crypto_box_seal_open(cipherBytes, pubKey, privKey)
    if(!msg){
      throw new Error("Decryption failed. Keys may not match ciphertext.")
    }
    ui.decryptOut.value = sodiumLib.to_string(msg)
    ui.copyPlain.disabled = false
  }catch(err){
    setNotice(ui.decryptNotice, "Decrypt failed: " + err)
  }
}

async function copyValue(value){
  try{ await navigator.clipboard.writeText(value) }catch{}
}

ui.genBtn.addEventListener("click", genkey)
ui.encryptBtn.addEventListener("click", encrypt)
ui.decryptBtn.addEventListener("click", decrypt)
ui.copyCipher.addEventListener("click", () => copyValue(ui.encryptOut.value))
ui.copyPlain.addEventListener("click", () => copyValue(ui.decryptOut.value))
ui.copyLink.addEventListener("click", () => {
  const pub = ui.pub.value.trim()
  if(!pub) return
  const base = location.origin === "null" ? location.href.split("?")[0] : `${location.origin}${location.pathname}`
  const link = `${base}?pub=${encodeURIComponent(pub)}`
  copyValue(link)
})

ui.backToDecrypt.addEventListener("click", () => {
  history.replaceState("", document.title, location.pathname)
  ui.encryptPub.value = ""
  ui.encryptPanel.classList.add("hidden")
  ui.decryptPanel.classList.remove("hidden")
})

const selectable = [ui.pub, ui.priv, ui.encryptPub, ui.encryptMsg, ui.encryptOut, ui.decryptMsg, ui.decryptOut]
selectable.forEach((el) => el.addEventListener("focus", () => el.select()))

function applyTheme(isLight){
  document.documentElement.classList.toggle("light", isLight)
  ui.themeLabel.textContent = isLight ? "Dark" : "Light"
  localStorage.setItem("theme", isLight ? "light" : "dark")
}

ui.themeToggle.addEventListener("click", () => {
  const isLight = !document.documentElement.classList.contains("light")
  applyTheme(isLight)
})

window.addEventListener("load", () => {
  const saved = localStorage.getItem("theme") || "dark"
  applyTheme(saved === "light")

  const params = new URLSearchParams(location.search)
  const pubParam = params.get("pub")
  if(pubParam){
    ui.encryptPub.value = pubParam
    ui.encryptPanel.classList.remove("hidden")
    ui.decryptPanel.classList.add("hidden")
  }

  updateKeyActions()
  initSodium().then(() => {
    if(ui.decryptPanel.classList.contains("hidden")) return
    genkey()
  })
})
</script>
</body>
</html>
